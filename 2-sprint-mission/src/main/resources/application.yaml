spring:
  application:
    name: discodeit
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  jpa:
    open-in-view: false # OSIV 비활성화
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

discodeit:
  repository:
    type: file
    file-directory: .discodeit
  storage:
    type: local
    local:
      root-path: ./uploads/

logging:
  level:
    root: info